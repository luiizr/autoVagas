<div class="backdrop" role="presentation" (click)="close()">
  <section class="dialog" role="dialog" aria-modal="true" [attr.aria-label]="mode() === 'login' ? 'Entrar' : 'Criar conta'" (click)="$event.stopPropagation()">
    <button class="close" type="button" aria-label="Fechar" (click)="close()">×</button>
    @if (mode() === 'login') {
      <span>ACESSO</span><h2>Entre na sua conta</h2>
      <form [formGroup]="loginForm" (ngSubmit)="submitLogin()"><label>E-mail<input type="email" formControlName="email" autocomplete="email" /></label><label>Senha<input type="password" formControlName="password" autocomplete="current-password" /></label><button>Entrar</button></form>
    } @else {
      <span>COMECE AQUI</span><h2>Ative seus alertas</h2><p>Crie uma conta para manter suas preferências protegidas.</p>
      <form [formGroup]="registerForm" (ngSubmit)="submitRegister()"><label>Nome<input formControlName="name" autocomplete="name" /></label><label>E-mail<input type="email" formControlName="email" autocomplete="email" /></label><label>Senha<input type="password" formControlName="password" autocomplete="new-password" /></label><button>Criar conta</button></form>
    }
    @if (error) { <p class="error">{{ error }}</p> }
  </section>
</div>
