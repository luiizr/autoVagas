<header class="header"><a routerLink="/" class="brand">AUTOVAGAS</a><nav><a routerLink="/vagas">Vagas</a>@if(auth.user();as user){<a routerLink="/configuracoes">Configurações</a><button (click)="auth.logout()">Sair</button>}@else{<button class="link-button" (click)="openAuth('login')">Entrar</button><button class="join" (click)="openAuth('register')">Criar conta</button>}</nav></header><main><ng-content /></main><footer>AutoVagas não substitui a leitura da vaga e de seus documentos oficiais.</footer>@if(authMode){<av-auth-modal [mode]="authMode" (closed)="closeAuth()"/>}
